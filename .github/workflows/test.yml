name: Test
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  unittest:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: |
        files=$(gofmt -l -s .)
        if [ -n "$files" ]; then
          echo "gofmt needed for:"
          echo "$files"
          exit 1
        fi

    - name: Run go vet
      run: go vet ./...

    - name: Run unit tests with coverage
      run: |
        mkdir -p .tmp
        go test -coverprofile=.tmp/coverage.txt ./...
        go tool cover -func=.tmp/coverage.txt | tail -1
